<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hair</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0d0e11; color: #d8dbe2; font: 12px/1.4 system-ui, sans-serif; overflow: hidden; }
      canvas#gfx { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
      #hud { position: fixed; left: 10px; top: 10px; padding: 8px 10px; background: #000a; border-radius: 6px; font-family: ui-monospace, monospace; white-space: pre; pointer-events: none; }
      #brush { position: fixed; border: 1.5px solid #fff9; border-radius: 50%; pointer-events: none; display: none; transform: translate(-50%, -50%); box-shadow: 0 0 0 1px #0006; }
      #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0d0e11cc; font-size: 15px; z-index: 10; }
      #overlay.hidden { display: none; }
      #help { position: fixed; left: 10px; bottom: 10px; padding: 6px 10px; background: #000a; border-radius: 6px; opacity: 0.8; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="gfx"></canvas>
    <div id="hud"></div>
    <div id="brush"></div>
    <div id="help">Right-drag orbit · Shift+right-drag pan · Wheel zoom · Left-drag uses the current tool · Shift+left-drag moves the head · 1–5 switch tools (orbit, cut, clipper, comb, hand)</div>
    <div id="overlay">Starting…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
